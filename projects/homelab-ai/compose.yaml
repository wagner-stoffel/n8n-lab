name: homelab-ai

services:
  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:2.48.4}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_HOST_PORT:-5680}:5678"
    environment:
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_EDITOR_BASE_URL: http://localhost:${N8N_HOST_PORT:-5680}
      N8N_WEBHOOK_URL: http://localhost:${N8N_HOST_PORT:-5680}/
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - services

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - services
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

networks:
  services:

volumes:
  n8n_data:
  ollama_data:

